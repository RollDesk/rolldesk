# Production compose file — runs pre-built images pulled from GitHub Container
# Registry instead of building on the server. IMAGE_PREFIX and TAG come from the
# server .env; the defaults below point at this project's own published images, so
# the server only has to choose a tag.
#
# The packages are private, so authenticate once on the server:
#   docker login ghcr.io -u <github-user> --password-stdin   # token with read:packages
# Then roll out with:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rolldesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rolldesk}
      POSTGRES_DB: ${POSTGRES_DB:-rolldesk}
    volumes:
      # PostgreSQL 18+ images store data under /var/lib/postgresql (in a
      # major-version subdirectory), so the volume is mounted there.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rolldesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/rolldesk/rolldesk}-backend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-rolldesk}:${POSTGRES_PASSWORD:-rolldesk}@db:5432/${POSTGRES_DB:-rolldesk}
      # REQUIRED: the backend refuses to start in production without a JWT secret.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in production}
      # How long a session lasts before password + TOTP are needed again. A
      # session token cannot be revoked before it expires, so lower this where
      # that matters more than not signing in every morning.
      SESSION_TTL: ${SESSION_TTL:-30d}
      ALLOWED_IPS: ${ALLOWED_IPS:-}
      TRUST_PROXY: "1"
      # Public base URL of the app — used to link back to RollDesk in
      # notifications and to build the SSO redirect URI (required for SSO).
      APP_BASE_URL: ${APP_BASE_URL:-}
      # Zone for the timestamps written on deployment timelines and in the change
      # history (the image itself has no zone, which would mean UTC stamps next to
      # the browser's local ones).
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Warsaw}
      # Language outgoing notifications are written in ('pl' | 'en'); empty means
      # each one inherits the UI language of whoever triggered it.
      NOTIFY_LANG: ${NOTIFY_LANG:-pl}
      # Link patterns for the two ids on a fixed issue: the HaloITSM ticket from
      # the work item's "SM Problem" field, and the Azure Boards work item itself.
      # {id} is where the id goes; empty means that id stays plain text.
      ISSUE_TRACKER_URL: ${ISSUE_TRACKER_URL:-}
      WORKITEM_URL: ${WORKITEM_URL:-}
      # Encryption key for stored SSO/OIDC client secrets (AES-256-GCM).
      SSO_ENC_KEY: ${SSO_ENC_KEY:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_FAIL_MODE: ${CLAMAV_FAIL_MODE:-reject}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-RollDesk <no-reply@rolldesk.local>}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      # GRAPH_ENABLED=0 → webhooks (default). Set to 1 once Graph app-only
      # permissions + admin consent allow channel posting.
      GRAPH_ENABLED: ${GRAPH_ENABLED:-0}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      TEAMS_TEAM_ID: ${TEAMS_TEAM_ID:-}
      TEAMS_CHANNEL_ID: ${TEAMS_CHANNEL_ID:-}
      # Web Push (browser notifications). Generate the pair once per instance with
      # `npx web-push generate-vapid-keys` and keep the private half in .env only.
      # With either value missing, browser notifications report themselves off and
      # the app behaves exactly as it did before they existed.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Update check — the backend queries GitHub releases and caches the result.
      # All optional; the token only raises GitHub's anonymous rate limit.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      VERSION_CHECK_REPO: ${VERSION_CHECK_REPO:-RollDesk/rolldesk}
      VERSION_CHECK_TTL_MS: ${VERSION_CHECK_TTL_MS:-3600000}

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/rolldesk/rolldesk}-frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      ALLOWED_IPS: ${ALLOWED_IPS:-}
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  db-data:
  clamav-data:
